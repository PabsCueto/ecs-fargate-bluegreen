name: Build and push image to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # necesario para OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecs-fargate-bluegreen

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORAL: borrar cuando el login con OIDC funcione.
      # Imprime los claims del token (no el token) para comparar el "sub"
      # real con el de la política de confianza del rol.
      - name: Debug OIDC claims
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keys = ("sub", "aud", "iss", "repository", "ref", "job_workflow_ref")
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::956565059803:role/github-actions-ecs-fargate-bluegreen
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Smoke test (el contenedor arranca y responde)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run -d --name api -p 8000:8000 "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          curl -fs --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/health
          curl -fs http://localhost:8000/version
          docker rm -f api

      - name: Push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"