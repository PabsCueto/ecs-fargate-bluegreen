name: Build and push image to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # necesario para OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecs-fargate-bluegreen

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::956565059803:role/github-actions-ecs-fargate-bluegreen
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Smoke test (el contenedor arranca y responde)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run -d --name api -p 8000:8000 "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # --retry-all-errors: el puerto puede aceptar la conexión antes de que
          # uvicorn termine de arrancar (curl devuelve 56) y hay que reintentar.
          curl -fs --retry 15 --retry-delay 1 --retry-all-errors http://localhost:8000/health
          echo
          curl -fs http://localhost:8000/version
          echo
          docker rm -f api

      - name: Logs del contenedor (solo si el smoke test falla)
        if: failure()
        run: |
          docker ps -a
          docker logs api || true

      - name: Push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
